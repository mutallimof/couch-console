<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Couch Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232F80ED'/%3E%3Ccircle cx='32' cy='32' r='12' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <!-- Home menu -->
  <main class="menu">
    <div id="tiles" class="tiles"></div>
    <footer class="bar">
      <span id="clock" class="clock"></span>
      <span id="date" class="date"></span>
      <span id="sound-hint" class="sound-hint">Click this page once to turn on sound</span>
    </footer>
  </main>

  <!-- An open app (game or settings) zooms out of its tile into this layer -->
  <div id="stage" class="stage" hidden>
    <div id="stage-content" class="stage-content"></div>
  </div>

  <!-- Pairing: shown when no phone is connected, or from Settings -> Show QR code -->
  <section id="pairing" class="pairing">
    <h1 class="title">Couch Console</h1>

    <div class="pair-card">
      <div class="qr-box">
        <img id="qr" alt="QR code to join with your phone" hidden>
        <div id="qr-loading" class="qr-loading">Loading…</div>
      </div>
      <div class="pair-info">
        <p class="hint">Scan with your phone</p>
        <p class="room-label">Room code</p>
        <p id="room-code" class="room-code">····</p>
        <p id="join-url" class="join-url"></p>
      </div>
    </div>

    <div id="slots" class="slots"></div>
    <p id="pairing-close" class="pairing-close" hidden>Press A or B to close</p>
    <p id="status" class="status"></p>
  </section>

  <!-- One cursor per player is drawn here, above everything -->
  <div id="cursors" class="cursors"></div>

  <pre id="debug" class="debug" hidden></pre>

  <!-- socket.io client is served by the Node server -->
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/console/main.js"></script>
</body>
</html>
