<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <title>Couch Console Guest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232F80ED'/%3E%3Ccircle cx='32' cy='32' r='12' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/remote.css">
</head>
<body class="guest-page">
  <header class="top">
    <div class="conn"><span id="dot" class="dot wait"></span><span id="conn-text">Connecting…</span></div>
  </header>
  <main class="panel">
    <div class="panel-scroll">
      <h1 id="g-title" class="g-title">Add photos</h1>
      <p id="g-sub" class="muted"></p>
      <label class="g-name"><span class="muted">Your name (optional)</span>
        <input id="g-name" class="room-input w-name" maxlength="16" autocomplete="off" placeholder="Guest" enterkeyhint="done"></label>
      <div id="g-photos" class="g-box" hidden>
        <div id="g-status" class="g-status" aria-live="polite"></div>
        <ul id="g-errors" class="g-errors"></ul>
      </div>
      <form id="g-music" class="g-box" hidden>
        <label class="muted" for="g-link">Paste a YouTube link</label>
        <input id="g-link" class="room-input w-name g-link" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://youtu.be/…" enterkeyhint="go">
        <p class="muted mp-how">In the YouTube app: <b>Share → Copy link</b>, then paste it here.</p>
        <p id="g-msg" class="mp-msg" hidden></p>
        <div id="g-search" hidden>
          <label class="muted" for="g-q">Or search</label>
          <input id="g-q" class="room-input w-name g-link" autocomplete="off" placeholder="Song or artist" enterkeyhint="search">
          <ul id="g-results" class="mp-list"></ul>
        </div>
      </form>
    </div>
    <div class="panel-actions">
      <input id="g-file" type="file" accept="image/*" multiple hidden>
      <button id="g-add" class="join-btn g-big" type="button" disabled>📷 Add photos</button>
    </div>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/phone/guest.js"></script>
</body>
</html>
